<!DOCTYPE html>
<html>
<head>
  <title>BlenderBot Chat</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    #chatbox { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: scroll; }
    .user { color: blue; }
    .bot { color: green; }
  </style>
</head>
<body>
  <h2>BlenderBot Chat</h2>
  <div id="chatbox"></div>
  <input type="text" id="message" placeholder="Type a message..." />
  <button onclick="sendMessage()">Send</button>

  <script>
    async function sendMessage() {
      const msg = document.getElementById("message").value;
      document.getElementById("chatbox").innerHTML += "<div class='user'>You: " + msg + "</div>";
      document.getElementById("message").value = "";

      const response = await fetch("http://localhost:5000/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg })
      });
      const data = await response.json();
      document.getElementById("chatbox").innerHTML += "<div class='bot'>Bot: " + data.reply + "</div>";
    }
  </script>
</body>
</html>
